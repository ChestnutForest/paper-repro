# Ruff の設定。
#
# 目的は、AGENTS.md §7.1 で定めた docstring の規約を、人の目ではなく
# 機械で守ることにある。設定が無いと Ruff は既定の規則しか見ず、
# PEP 257 の D 規則を一切検査しない。
#
# 準拠する標準は docs/references.md の REF-18（PEP 257）と REF-19（PEP 8）。

line-length = 88  # Black の既定に合わせる。逸脱の理由は AGENTS.md §7.1.5。

[lint]
# E4/E7/E9 と F は Ruff の既定。D を足して docstring を検査対象にする。
select = ["E4", "E7", "E9", "F", "D"]

ignore = [
    # D400「要約行はピリオドで終わること」。
    # 本プロジェクトの docstring は日本語で書くため、要約行は句点「。」で終わる。
    # D400 は ASCII のピリオドだけを認めるので、日本語では必ず誤検出になる。
    # 句点で終えること自体は AGENTS.md §7.1.2 で規約として定めており、
    # 検査は同 §7.1.8 の自作スクリプトが担う。
    "D400",
]

[lint.pydocstyle]
# PEP 257 の規約に従う。D203 と D211、D212 と D213 のような
# 相互に矛盾する規則の取捨は、この指定が解決する。
convention = "pep257"
